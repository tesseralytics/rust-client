name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure a "crates-io" environment with trusted publishing on crates.io
    # (https://crates.io/settings/publishing-trust). The crate must exist there
    # before trusted publishing can be registered for it — the first publish
    # may need a one-off API token instead.
    environment:
      name: crates-io
      url: https://crates.io/crates/tessera-api
    permissions:
      id-token: write  # OIDC — no API token needed
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set crate version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a v-prefixed semver tag (e.g. v0.2.0)" >&2
            exit 1
          fi
          version="${tag#v}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${version}\"/" Cargo.toml
          # --locked below requires the lockfile's root package version to match
          cargo update -p tessera-api
          grep -qx "version = \"${version}\"" Cargo.toml
      - id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

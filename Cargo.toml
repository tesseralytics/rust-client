[package]
name = "tessera-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance Rust client for the Tessera API — Hyperliquid datasets straight into Polars & DuckDB."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/tesseralytics/rust-client"
homepage = "https://tesseralytics.dev"
documentation = "https://docs.rs/tessera-api"
keywords = ["hyperliquid", "crypto", "market-data", "ohlcv", "quant"]
categories = ["api-bindings"]
authors = ["Tessera <hello@tesseralytics.dev>"]

[lib]
name = "tessera"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[features]
default = ["polars"]
polars = ["dep:polars"]
duckdb = ["dep:duckdb"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
fastrand = "2"
futures = "0.3"
polars = { version = "0.55", default-features = true, features = ["lazy", "parquet", "http"], optional = true }
duckdb = { version = "1", features = ["bundled", "parquet"], optional = true }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
